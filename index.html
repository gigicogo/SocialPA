x;line-height:1;font-weight:780;letter-spacing:-.04em;color:var(--navy);display:block;margin-bottom:8px}.result-box{border-left:4px solid var(--orange);padding-left:20px;margin:24px 0 0}.review-list{display:grid;gap:16px}.review-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:23px}.review-item h2{font-size:21px;margin:6px 0 12px}.review-item p{font-size:16px}.review-item .source{font-size:14px}.review-note{padding:14px 16px;background:#f1f6f9;border-left:3px solid var(--blue);margin-top:12px}.finished{color:var(--ok);font-weight:650}.footer{background:#fff;border-top:1px solid var(--line);padding:22px 0}.footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.home-summary{border-left:4px solid var(--orange);padding:14px 20px;background:#fff;margin-bottom:26px}.home-summary p{font-size:16px;margin:0}.print-title{display:none}

<script>
'use strict';
const ACTIVITIES={
 a1:{code:'A1',section:'Comunicazione pubblica',title:'Quale post aiuta davvero?',description:'Leggi una situazione e scegli, tra tre proposte, il messaggio più utile per il cittadino.',minutes:5,kind:'post',takeaway:'Un messaggio utile chiarisce che cosa cambia, quando e che cosa può fare il cittadino.',rounds:[
  {title:'La biblioteca chiude un giorno',prompt:'Quale messaggio permette al cittadino di organizzarsi?',facts:['La biblioteca civica chiude martedì 16 marzo 2027 per manutenzione.','Le restituzioni previste quel giorno possono avvenire il 17 marzo, senza penalità.','Le informazioni sono nella scheda «Biblioteca civica» del sito comunale.'],correct:'library-clear',options:[
   {id:'library-celebration',text:'Una biblioteca sempre più bella e moderna! Prosegue il nostro impegno per migliorare gli spazi dedicati alla cultura. Grazie a tutti per il sostegno: continuate a seguirci per scoprire le novità.',feedback:'Il messaggio valorizza l’intervento, ma non dice al lettore quando troverà chiuso e come gestire la restituzione.'},
   {id:'library-clear',text:'Martedì 16 marzo la biblioteca civica sarà chiusa per manutenzione. Le restituzioni previste per quel giorno potranno essere effettuate il 17 marzo, senza penalità. Dettagli nella scheda «Biblioteca civica» del sito comunale.',feedback:'Il cittadino trova subito data, cambiamento e alternativa. Sa come organizzarsi e dove approfondire.'},
   {id:'library-bureaucracy',text:'Si rende noto che, in ragione dell’espletamento degli interventi manutentivi programmati, in data 16 marzo 2027 si determinerà l’indisponibilità alla fruizione degli spazi bibliotecari. Per gli adempimenti restitutori si rinvia alle determinazioni conseguenti.',feedback:'La data è presente, ma il linguaggio rende difficile capire che cosa accade e come comportarsi con le restituzioni.'}
  ]},
  {title:'Le iscrizioni al nido',prompt:'Quale proposta aiuta le famiglie a fare il passo successivo?',facts:['Le domande per il nido si presentano dal 1° al 20 aprile 2027.','Si usa il portale «Servizi educativi» del Comune.','L’URP offre assistenza su appuntamento a chi ha difficoltà.'],correct:'nursery-clear',options:[
   {id:'nursery-vague',text:'Sono aperte le iscrizioni al nido! Un’occasione da cogliere per le famiglie del nostro territorio. Vi aspettiamo numerosi: scoprite tutte le opportunità e seguite la pagina per restare aggiornati.',feedback:'L’invito è comprensibile, ma mancano scadenza, modalità di domanda e indicazione dell’assistenza.'},
   {id:'nursery-bureaucracy',text:'Si comunica l’attivazione della procedura telematica finalizzata all’acquisizione delle istanze per i servizi educativi della prima infanzia. I soggetti interessati sono invitati ad attenersi ai termini e alle modalità disciplinati dall’avviso.',feedback:'Il testo rimanda ad altre informazioni senza fornire gli elementi essenziali per iniziare.'},
   {id:'nursery-clear',text:'Iscrizioni al nido: puoi presentare la domanda dal 1° al 20 aprile sul portale «Servizi educativi» del Comune. Se hai difficoltà, l’URP offre assistenza su appuntamento. Nel portale trovi requisiti e istruzioni.',feedback:'La famiglia conosce periodo, canale di presentazione e possibilità di assistenza. Il rimando al portale serve per i dettagli.'}
  ]},
  {title:'Il nuovo orario dell’URP',prompt:'Quale testo rende più chiaro il cambiamento?',facts:['Dal 5 aprile 2027, il giovedì l’URP apre dalle 14 alle 17, anziché al mattino.','Negli altri giorni gli orari restano invariati.','Il quadro completo è nella pagina «URP» del sito comunale.'],correct:'urp-clear',options:[
   {id:'urp-clear',text:'Dal 5 aprile, il giovedì l’URP sarà aperto dalle 14 alle 17, anziché al mattino. Gli orari degli altri giorni non cambiano. Consulta il quadro completo nella pagina «URP» del sito comunale.',feedback:'Il cambiamento è concreto: giorno, decorrenza e fascia oraria. Il cittadino può distinguere la novità dagli orari che restano invariati.'},
   {id:'urp-bureaucracy',text:'Con decorrenza dal 5 aprile 2027 si procederà alla rimodulazione dell’articolazione temporale dell’apertura al pubblico dell’Ufficio Relazioni con il Pubblico nella giornata del giovedì, ferme restando le restanti previsioni organizzative.',feedback:'Il testo annuncia una modifica, ma non indica il nuovo orario. Il lettore dovrebbe cercare da solo l’informazione principale.'},
   {id:'urp-celebration',text:'L’URP si rinnova per esservi sempre più vicino! Ascolto, innovazione e attenzione alle persone guidano il nostro lavoro quotidiano. Vi invitiamo a scoprire il nuovo orario e a condividere questo importante aggiornamento.',feedback:'Il tono è positivo, ma il cambiamento di orario rimane indefinito. Per questo avviso serve anzitutto un’informazione pratica.'}
  ]}
 ]},
 b1:{code:'B1',section:'X · LinkedIn · YouTube',title:'Lo stesso avviso, tre confezioni',description:'Un unico servizio da raccontare. Per ogni canale scegli, tra due proposte, l’adattamento più coerente con l’obiettivo indicato.',minutes:6,kind:'channel',takeaway:'Il contenuto può vivere su più canali. Formato, taglio e invito all’azione vanno adattati al compito.',facts:['Il Comune immaginario di Borgo Sereno apre lo Sportello digitale il 4 marzo 2027.','Lo sportello aiuta a usare i servizi comunali online.','È aperto il giovedì, dalle 9 alle 12, nella biblioteca civica.','La prenotazione avviene nella pagina «Sportello digitale» del sito comunale.'],rounds:[
  {title:'Un aggiornamento su X',channel:'X',prompt:'Vuoi annunciare l’apertura e far trovare subito le informazioni per prenotare.',correct:'x-clear',options:[
   {id:'x-clear',text:'Dal 4 marzo apre lo Sportello digitale di Borgo Sereno: assistenza per i servizi comunali online, il giovedì dalle 9 alle 12 in biblioteca. Prenotazioni nella pagina «Sportello digitale» del sito comunale.',link:'Vai alla pagina «Sportello digitale»',feedback:'Una sintesi operativa permette di capire servizio, avvio, orario e azione successiva. Il collegamento porta ai dettagli e alla prenotazione.'},
   {id:'x-vague',text:'Il futuro è arrivato! Il nostro Comune è pronto ad accompagnarvi verso nuove opportunità digitali. Una grande novità attende tutti i cittadini: seguiteci e condividete questo traguardo!',feedback:'L’annuncio crea attesa, ma non permette di capire quale servizio sia disponibile, da quando e come prenotare.'}
  ]},
  {title:'Il progetto su LinkedIn',channel:'LinkedIn',prompt:'Vuoi raccontare il valore del progetto e il lavoro degli uffici, indicando anche dove conoscere il servizio.',correct:'linkedin-project',options:[
   {id:'linkedin-empty',text:'Borgo Sereno guarda al futuro! Un progetto di grande valore prende finalmente forma e porta nuova energia nella nostra organizzazione. Siamo felici di condividere questo successo con tutta la nostra rete professionale.',feedback:'Il testo celebra il progetto senza descriverlo. Mancano il bisogno a cui risponde, il lavoro svolto e il rimando al servizio.'},
   {id:'linkedin-project',text:'Un punto di assistenza per rendere più semplice l’uso dei servizi comunali online: dal 4 marzo Borgo Sereno apre lo Sportello digitale in biblioteca.\n\nIl progetto nasce dalla collaborazione tra URP, biblioteca e servizi informatici. Il lavoro degli uffici mette le competenze a disposizione delle persone che hanno bisogno di un aiuto pratico.\n\nOrari e prenotazioni nella pagina «Sportello digitale» del sito comunale.',link:'Conosci il servizio e le modalità di accesso',feedback:'Il post mette in relazione il bisogno delle persone, la collaborazione professionale e il servizio realizzato. Mantiene un’indicazione pratica per approfondire.'}
  ]},
  {title:'La videoguida su YouTube',channel:'YouTube',prompt:'Devi dare un titolo e una descrizione a un video che mostra come prenotare lo Sportello digitale.',correct:'youtube-guide',options:[
   {id:'youtube-guide',headline:'Sportello digitale di Borgo Sereno: come prenotare',text:'In questa guida trovi i passaggi per prenotare lo Sportello digitale del Comune. Il servizio parte il 4 marzo 2027 ed è disponibile il giovedì dalle 9 alle 12 nella biblioteca civica.\n\nPer prenotare e trovare le informazioni aggiornate, apri la pagina «Sportello digitale» del sito comunale.',link:'Pagina ufficiale del servizio e prenotazione',feedback:'Titolo e descrizione fanno capire che cosa insegna il video e dove trovare il servizio. Il collegamento permette di passare dalla visione all’azione.'},
   {id:'youtube-empty',headline:'Video 1 — Una grande novità!',text:'Guarda il nostro nuovo video fino alla fine. Ti presentiamo un progetto importante per il Comune. Lascia un mi piace, condividi e continua a seguirci per non perdere le prossime novità.',feedback:'Il titolo non permette di capire il tema della guida. La descrizione chiede interazioni ma non spiega la prenotazione né indica la pagina del servizio.'}
  ]}
 ]},
 c:{code:'C',section:'Le regole della comunicazione',title:'La scelta è corretta?',description:'Cinque situazioni, una scelta alla volta. Valuta soltanto l’aspetto descritto: dopo la risposta trovi la regola e la fonte.',minutes:7,kind:'law',takeaway:'Le regole orientano le scelte: servizio al cittadino, ruoli, accessibilità, dati personali e pubblicazione degli atti.',rounds:[
  {title:'Una guida per i cittadini',situation:'Il Comune pubblica una guida chiara che spiega come accedere a un servizio pubblico e rimanda alla pagina ufficiale con le istruzioni.',correct:'yes',rule:'Comunicazione orientata al servizio',norm:'Legge 150/2000, art. 1',url:'https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:legge:2000-06-07;150',explanation:'È una scelta coerente con le finalità della comunicazione pubblica: favorire la conoscenza dei servizi e il loro utilizzo. Qui valutiamo lo scopo informativo della guida.'},
  {title:'Un’assunzione obbligatoria?',situation:'«La Legge 69/2025 obbliga ogni Comune ad assumere un social media manager».',correct:'no',rule:'Una facoltà dell’amministrazione',norm:'DL 25/2025, art. 4, comma 9-novies, convertito dalla Legge 69/2025',url:'https://www.gazzettaufficiale.it/atto/serie_generale/caricaArticolo?art.codiceRedazionale=25A02898&art.dataPubblicazioneGazzetta=2025-05-13&art.flagTipoArticolo=0&art.idArticolo=4&art.idGruppo=2&art.idSottoArticolo=1&art.idSottoArticolo1=10&art.progressivo=0&art.versione=1',explanation:'La norma prevede una possibilità, entro i limiti stabiliti. L’amministrazione può individuare il social media e digital manager tra il personale in servizio o nell’ambito di nuove assunzioni autorizzate. Non impone una nuova assunzione a ogni Comune.'},
  {title:'Le informazioni della locandina',situation:'Il post contiene una locandina. Date, luogo e istruzioni sono riportati anche come testo leggibile; l’immagine ha una descrizione alternativa utile.',correct:'yes',rule:'Informazioni fruibili anche oltre l’immagine',norm:'Legge 4/2004 e riferimenti AgID sull’accessibilità',url:'https://www.agid.gov.it/it/ambiti-intervento/accessibilita-usabilita',explanation:'È una scelta che favorisce l’accessibilità: le informazioni essenziali sono disponibili anche a chi non può leggere la locandina. Il caso valuta questo aspetto specifico, non certifica l’accessibilità completa del contenuto.'},
  {title:'Una risposta pubblica',situation:'Per rispondere a una segnalazione sui social, l’ufficio pubblica senza necessità il codice fiscale e il numero di cellulare privato del cittadino.',correct:'no',rule:'Dati personali limitati al necessario',norm:'GDPR, art. 5, paragrafo 1, lettera c)',url:'https://eur-lex.europa.eu/eli/reg/2016/679/oj/?locale=it',explanation:'La risposta pubblica deve rispettare la protezione dei dati personali. Nel caso descritto, diffondere codice fiscale e recapito privato è superfluo rispetto alla finalità: occorre ometterli e usare, quando opportuno, il canale di assistenza previsto.'},
  {title:'Il post sostituisce l’albo?',situation:'Per un provvedimento è prevista la pubblicazione nell’albo online. L’ufficio decide di pubblicarlo soltanto su LinkedIn, considerando assolto quell’adempimento.',correct:'no',rule:'Diffusione social e pubblicità legale hanno funzioni diverse',norm:'Legge 69/2009, art. 32; Legge 150/2000, art. 1, comma 3',url:'https://def.finanze.it/DocTribFrontend/getAttoNormativoDetail.do?ACTION=getArticolo&articolo=Articolo+32&codiceOrdinamento=200003200000000&id=%7BBC02CF63-0EB1-4E94-ADE2-008657053586%7D',explanation:'Il post può dare notizia del provvedimento e rinviare alla fonte ufficiale. Nel caso descritto resta necessaria la pubblicazione nell’albo online prevista per l’atto. La Legge 69/2009 riguarda questo tema ed è distinta dalla Legge 69/2025 sul decreto PA.'}
 ]}
};
const KEY='social-pa-a1-b1-c-v1';
let memoryOnly=false;
function fresh(){return {version:1,activities:{a1:{answers:[],index:0},b1:{answers:[],index:0},c:{answers:[],index:0}}};}
function loadState(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(!raw||raw.version!==1)return fresh();const clean=fresh();for(const id of Object.keys(ACTIVITIES)){const stored=raw.activities?.[id];if(!stored)continue;clean.activities[id].index=Math.max(0,Math.min(ACTIVITIES[id].rounds.length-1,Number.isInteger(stored.index)?stored.index:0));clean.activities[id].answers=ACTIVITIES[id].rounds.map((r,i)=>{const a=stored.answers?.[i];if(!a)return null;const valid=id==='c'?['yes','no']:r.options.map(o=>o.id);if(!valid.includes(a.first))return null;return {first:a.first,last:valid.includes(a.last)?a.last:null,attempts:Math.max(1,Number.isInteger(a.attempts)?a.attempts:1)};});}return clean;}catch{memoryOnly=true;return fresh();}}
let state=loadState();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{memoryOnly=true;}}
const main=document.getElementById('contenuto');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paras=t=>String(t).split('\n\n').map(p=>'<p>'+esc(p)+'</p>').join('');
const countDone=id=>state.activities[id].answers.filter(a=>a&&a.last).length;
const isDone=id=>countDone(id)===ACTIVITIES[id].rounds.length;
const firstScore=id=>ACTIVITIES[id].rounds.filter((r,i)=>state.activities[id].answers[i]?.first===r.correct).length;
function sourceLink(round){return '<a class="source" href="'+esc(round.url)+'" target="_blank" rel="noopener noreferrer">Fonte: '+esc(round.norm)+' <span aria-hidden="true">↗</span><span class="small"> (nuova scheda)</span></a>';}
function navigate(route){if(location.hash===route)render();else location.hash=route;}
function focusPage(){main.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function card(id){const a=ACTIVITIES[id],n=countDone(id),done=isDone(id);return '<article class="activity-card '+id+'"><div class="card-top"><span class="code">'+a.code+' · '+(id==='a1'?'COMUNICAZIONE':id==='b1'?'CANALI':'REGOLE')+'</span><span class="tag '+(done?'done':'')+'">'+(done?'Completato':n?n+'/'+a.rounds.length+' svolti':a.minutes+' minuti')+'</span></div><h2>'+esc(a.title)+'</h2><p>'+esc(a.description)+'</p><div class="card-bottom"><p class="small">'+a.rounds.length+(id==='b1'?' canali':' casi')+' · Riscontro dopo ogni scelta</p><a class="button primary block" href="#/'+id+(done?'/riepilogo':'')+'">'+(done?'Rivedi il riepilogo':n?'Riprendi l’attività':'Inizia l’attività')+'</a><div class="button-row" style="margin-top:10px"><button class="button text" data-action="copy-link" data-id="'+id+'">Copia link diretto</button></div></div></article>';}
function renderHome(){document.title='Laboratorio Social PA';const complete=Object.keys(ACTIVITIES).filter(isDone).length;main.innerHTML='<section class="hero"><p class="eyebrow">Il laboratorio del corso</p><h1>Tre esercizi per<br>comunicare meglio</h1><p class="lead">Scegli un’attività, leggi il caso e prova. Dopo ogni risposta trovi una spiegazione che ti aiuta a fare il passo successivo.</p><div class="meta-line"><span><span class="dot" aria-hidden="true"></span>Attività individuali</span><span>Circa 20 minuti in tutto</span><span>Puoi svolgerle nell’ordine che preferisci</span></div></section>'+(complete?'<div class="home-summary"><p><strong>'+complete+' attività su 3 completate.</strong> Puoi rivedere i riepiloghi o ripetere un’attività.</p></div>':'')+'<section class="activity-grid" aria-label="Scegli un esercizio">'+Object.keys(ACTIVITIES).map(card).join('')+'</section><div class="footnotes"><p class="small">'+(memoryOnly?'I progressi restano disponibili finché questa pagina è aperta.':'Puoi chiudere e riprendere dallo stesso browser. I progressi sono salvati solo qui.')+'</p><p class="small" id="copy-status" role="status" aria-live="polite"></p></div><details class="instructor"><summary>Per il docente</summary><div class="details-body"><p>Un percorso breve per il corso Social Media PA. Le scelte sono guidate e le situazioni sono inventate: gli esercizi non pubblicano contenuti sui social.</p><ul><li><strong>A1, circa 5 minuti.</strong> Tre messaggi da valutare rispetto all’utilità per il cittadino: biblioteca, iscrizioni al nido e orario dell’URP.</li><li><strong>B1, circa 6 minuti.</strong> Lo stesso Sportello digitale presentato su X, LinkedIn e YouTube. L’obiettivo di ogni passaggio rende esplicito il criterio editoriale.</li><li><strong>C, circa 7 minuti.</strong> Cinque situazioni su Legge 150/2000, Legge 69/2025, accessibilità, dati personali e pubblicità legale. Le fonti compaiono dopo la risposta e nel riepilogo.</li></ul><p>Ogni risposta produce una spiegazione. La persona può riprovare oppure proseguire. Il riepilogo distingue le scelte al primo tentativo e raccoglie ciò che è utile ricordare. La funzione «Stampa» consente anche il salvataggio in PDF dal browser.</p><p>Per l’aula puoi condividere un link diretto a una singola attività. La versione scaricabile si apre anche localmente ed è pronta per una pubblicazione statica.</p></div></details>';}
function exerciseHeader(id,index){const a=ACTIVITIES[id];return '<a class="back-link" href="#/">← Tutte le attività</a><div class="exercise-header"><div><p class="eyebrow">'+a.code+' · '+esc(a.section)+'</p><h1>'+esc(a.title)+'</h1><p class="lead">'+esc(a.description)+'</p></div><div class="progress-box"><div class="progress-text"><span>'+(id==='b1'?'Canale':'Caso')+' '+(index+1)+' di '+a.rounds.length+'</span><span>'+countDone(id)+(countDone(id)===1?' svolto':' svolti')+'</span></div><progress value="'+countDone(id)+'" max="'+a.rounds.length+'" aria-label="Casi svolti"></progress></div></div>';}
function panel(id,r){const a=ACTIVITIES[id];if(id==='c')return '<aside class="case-panel"><p class="eyebrow">Una regola alla volta</p><h2>Come funziona</h2><p>Leggi la situazione e scegli se la decisione descritta va bene o deve essere corretta.</p><p>Dopo la scelta scoprirai il motivo e il riferimento normativo.</p><p class="fiction">Valuta solo l’aspetto indicato nel caso.</p></aside>';const facts=id==='b1'?a.facts:r.facts;return '<aside class="case-panel"><p class="eyebrow">'+(id==='b1'?'Un unico servizio':'I fatti da comunicare')+'</p><h2>'+(id==='b1'?'Lo Sportello digitale':esc(r.title))+'</h2><ul>'+facts.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul><p class="fiction">Comune, situazioni e date sono inventati per l’esercizio.'+(id==='b1'?' Le anteprime mostrano testi, non interfacce reali dei social.':'')+'</p></aside>';}
function optionContent(id,r,o){if(id==='c')return '<strong>'+(o.id==='yes'?'Va bene':'Da correggere')+'</strong>';return (id==='b1'?'<span class="post-author">'+(r.channel==='YouTube'?'Video del Comune di Borgo Sereno':'Comune di Borgo Sereno')+'</span>':'')+(o.headline?'<span class="video-title">'+esc(o.headline)+'</span>':'')+paras(o.text)+(o.link?'<p class="mock-link">'+esc(o.link)+'</p>':'');}
function renderExercise(id){const a=ACTIVITIES[id],progress=state.activities[id],index=progress.index,r=a.rounds[index],answer=progress.answers[index],submitted=!!answer?.last;document.title=a.code+' · '+a.title+' | Laboratorio Social PA';const opts=id==='c'?[{id:'yes'},{id:'no'}]:r.options;main.innerHTML=exerciseHeader(id,index)+'<div class="workspace '+(id==='c'?'law-workspace':'')+'">'+panel(id,r)+'<section class="choice-panel" aria-label="Scelta del caso">'+(id==='b1'?'<span class="channel '+r.channel.toLowerCase()+'">'+esc(r.channel)+'</span>':'')+'<h2>'+esc(id==='a1'?'Scegli il messaggio':r.title)+'</h2>'+(id==='c'?'<div class="situation"><p>'+esc(r.situation)+'</p></div>':'<p class="instruction">'+esc(r.prompt)+'</p>')+'<div class="choices '+(id==='c'?'binary':'')+'">'+opts.map((o,j)=>{const selected=answer?.last===o.id;const right=submitted&&o.id===r.correct;const wrong=selected&&o.id!==r.correct;return '<button class="choice '+(selected?'selected ':'')+(right?'right ':'')+(wrong?'wrong':'')+'" data-action="answer" data-id="'+id+'" data-option="'+o.id+'" '+(submitted?'disabled':'')+'><span class="letter" aria-hidden="true">'+(id==='c'?(o.id==='yes'?'✓':'!'):String.fromCharCode(65+j))+'</span><span class="option-copy">'+optionContent(id,r,o)+(submitted&&selected?'<span class="option-state '+(wrong?'wrong-text':'')+'">La tua scelta'+(right?' · coerente con il caso':' · da rivedere')+'</span>':'')+(!selected&&right?'<span class="option-state">'+(id==='c'?'Risposta corretta':'Proposta più utile per questo compito')+'</span>':'')+'</span></button>';}).join('')+'</div><div id="feedback-slot" class="choice-status" aria-live="polite"></div><div class="nav-actions">'+(index>0?'<button class="button secondary" data-action="previous" data-id="'+id+'">Caso precedente</button>':'<span class="small">'+(id==='b1'?'Lo stesso contenuto può essere adattato a più canali.':'Leggi tutte le proposte prima di scegliere.')+'</span>')+(submitted?'<button class="button primary" data-action="next" data-id="'+id+'">'+(index===a.rounds.length-1?'Vai al riepilogo':id==='b1'?'Canale successivo':'Caso successivo')+' →</button>':'')+'</div></section></div>';if(submitted)showFeedback(id,false);}
function showFeedback(id,focus){const a=ACTIVITIES[id],i=state.activities[id].index,r=a.rounds[i],ans=state.activities[id].answers[i];if(!ans?.last)return;const correct=ans.last===r.correct;const o=id==='c'?null:r.options.find(x=>x.id===ans.last);const feedback=id==='c'?r.explanation:o.feedback;document.getElementById('feedback-slot').innerHTML='<section class="feedback '+(!correct?'review':'')+'" tabindex="-1" id="riscontro"><h3>'+(correct?(id==='c'?'Risposta corretta':'Una scelta utile per questo compito'):'Rivediamo insieme')+'</h3><p>'+esc(feedback)+'</p>'+(id==='c'?'<p><strong>'+esc(r.rule)+'</strong></p>'+sourceLink(r):'')+(!correct?'<div class="button-row"><button class="button secondary" data-action="retry-choice" data-id="'+id+'">Riprova la scelta</button></div>':'')+'</section>';if(focus)document.getElementById('riscontro').focus({preventScroll:false});}
function summaryText(id){const a=ACTIVITIES[id];return a.code+' — '+a.title+'\nScelte al primo tentativo: '+firstScore(id)+' su '+a.rounds.length+'\n\n'+a.takeaway+'\n\n'+a.rounds.map((r,i)=>{const text=id==='c'?((r.correct==='yes'?'Va bene. ':'Da correggere. ')+r.explanation+'\n'+r.norm+'\n'+r.url):(()=>{const o=r.options.find(o=>o.id===r.correct);return (o.headline?o.headline+'\n':'')+o.text+'\n'+(o.link?o.link+'\n':'')+o.feedback;})();return (i+1)+'. '+r.title+'\n'+text;}).join('\n\n')+'\n\nLaboratorio Social PA — Situazioni inventate per la formazione.';}
function renderSummary(id){const a=ACTIVITIES[id];if(!isDone(id)){const first=a.rounds.findIndex((r,i)=>!state.activities[id].answers[i]?.last);state.activities[id].index=Math.max(0,first);save();location.replace('#/'+id);renderExercise(id);return;}document.title='Riepilogo '+a.code+' | Laboratorio Social PA';main.innerHTML='<a class="back-link" href="#/">← Tutte le attività</a><section class="summary-hero"><p class="eyebrow">'+a.code+' · Attività completata</p><h1>'+esc(a.title)+'</h1><p class="lead">'+esc(a.takeaway)+'</p><div class="result-box"><span class="result-number">'+firstScore(id)+' / '+a.rounds.length+'</span><span>scelte corrette al primo tentativo</span><p class="small">Il riepilogo raccoglie le indicazioni utili, anche per i casi che hai riprovato.</p></div><div class="button-row"><button class="button secondary" data-action="print">Stampa il riepilogo</button><button class="button secondary" data-action="download" data-id="'+id+'">Scarica il riepilogo</button><button class="button text" data-action="reset" data-id="'+id+'">Rifai questa attività</button></div></section><section class="review-list" aria-label="Riepilogo dei casi">'+a.rounds.map((r,i)=>{const o=id==='c'?null:r.options.find(o=>o.id===r.correct);return '<article class="review-item"><span class="code">'+(i+1)+' / '+a.rounds.length+'</span><h2>'+esc(r.title)+'</h2>'+(id==='c'?'<p>'+esc(r.situation)+'</p><p class="finished">'+(r.correct==='yes'?'Va bene':'Da correggere')+'</p><p>'+esc(r.explanation)+'</p>'+sourceLink(r):'<div class="review-note">'+(o.headline?'<h3>'+esc(o.headline)+'</h3>':'')+paras(o.text)+(o.link?'<p class="mock-link">'+esc(o.link)+'</p>':'')+'</div><p style="margin-top:15px">'+esc(o.feedback)+'</p>')+'</article>';}).join('')+'</section><div class="button-row"><a class="button primary" href="#/">Scegli un’altra attività</a><button class="button secondary" data-action="copy-link" data-id="'+id+'">Copia link dell’attività</button><span id="copy-status" class="small" role="status" aria-live="polite"></span></div>';}
function render(){const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean),id=p[0];if(!ACTIVITIES[id])renderHome();else if(p[1]==='riepilogo')renderSummary(id);else renderExercise(id);focusPage();}
function giveAnswer(id,opt){const a=ACTIVITIES[id],i=state.activities[id].index,r=a.rounds[i];if(state.activities[id].answers[i]?.last)return;const valid=id==='c'?['yes','no']:r.options.map(o=>o.id);if(!valid.includes(opt))return;const old=state.activities[id].answers[i];state.activities[id].answers[i]={first:old?.first||opt,last:opt,attempts:(old?.attempts||0)+1};save();renderExercise(id);showFeedback(id,true);}
function directLink(id){return location.href.split('#')[0]+'#/'+id;}
async function copyLink(id){const value=directLink(id);let ok=false;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(value);ok=true;}}catch{}if(!ok){const field=document.createElement('textarea');field.value=value;field.setAttribute('aria-label','Link dell’attività');field.style.position='fixed';field.style.left='-9999px';document.body.appendChild(field);field.select();try{ok=document.execCommand('copy');}catch{}field.remove();}let slot=document.getElementById('copy-status');if(!slot){slot=document.createElement('p');slot.id='copy-status';slot.className='small';slot.setAttribute('role','status');main.appendChild(slot);}slot.textContent=(ok?'Link copiato.':value)+(location.protocol==='file:'?' Questo collegamento apre un file su questo computer. Per condividerlo con la classe usa l’indirizzo della versione online.':'');}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=b.dataset.id;switch(b.dataset.action){case 'skip-content':e.preventDefault();main.focus();main.scrollIntoView({block:'start'});break;case 'answer':giveAnswer(id,b.dataset.option);break;case 'retry-choice':{const i=state.activities[id].index;state.activities[id].answers[i].last=null;save();renderExercise(id);const first=main.querySelector('.choice');first?.focus();break;}case 'next':{const p=state.activities[id];if(!p.answers[p.index]?.last)return;if(p.index<ACTIVITIES[id].rounds.length-1){p.index++;save();renderExercise(id);focusPage();}else navigate('#/'+id+'/riepilogo');break;}case 'previous':state.activities[id].index=Math.max(0,state.activities[id].index-1);save();renderExercise(id);focusPage();break;case 'reset':state.activities[id]={answers:[],index:0};save();navigate('#/'+id);break;case 'copy-link':copyLink(id);break;case 'print':window.print();break;case 'download':{const blob=new Blob([summaryText(id)],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Riepilogo_'+ACTIVITIES[id].code+'_Social_PA.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);break;}}});
window.addEventListener('hashchange',render);
render();
</script>
